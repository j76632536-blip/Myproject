<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diwali Bonus Surprise 🪔</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:system-ui,Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#5b1b83,#160b35 65%,#09051c)}
.card{position:relative;z-index:2;width:min(92%,430px);padding:30px 22px;text-align:center;border:1px solid #ffcf6b66;border-radius:26px;background:#ffffff12;backdrop-filter:blur(10px);box-shadow:0 18px 60px #0008}
h1{font-size:clamp(27px,7vw,38px);margin:5px 0 10px;color:#ffd978}p{line-height:1.55;color:#fff0d4}
.coin{font-size:64px;filter:drop-shadow(0 0 18px #ffd34d);animation:bob 1.5s infinite ease-in-out}
button{border:0;border-radius:999px;padding:15px 24px;margin-top:12px;font-size:17px;font-weight:800;color:#451600;background:linear-gradient(100deg,#ffe58c,#ffad22);box-shadow:0 7px 0 #a95108;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 3px 0 #a95108}
#progress{height:13px;border-radius:20px;background:#ffffff26;overflow:hidden;margin:20px 0 8px;display:none}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ffb52e,#fff18a);transition:width .15s}
#result{display:none;font-size:clamp(22px,6vw,30px);font-weight:900;color:#ffe17d;margin:15px 0}
.small{font-size:12px;color:#ffeac2aa;margin-top:18px}
.confetti{position:fixed;top:-20px;z-index:1;font-size:22px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
@keyframes bob{50%{transform:translateY(-10px) rotate(5deg)}}
.reveal-photo{display:block;width:min(100%,300px);max-height:300px;object-fit:contain;margin:14px auto 0;border-radius:16px;border:3px solid #ffd978;box-shadow:0 8px 28px #0008}\n</style>
</head>
<body>
<div class="card">
  <div class="coin">🪙</div>
  <h1>आपके लिए दिवाली बोनस!</h1>
  <p id="intro">इस दिवाली किस्मत चमकने वाली है! आपके नाम का खास कैश गिफ्ट तैयार है। नीचे क्लिक करके अपना बोनस चेक करें।</p>
  <button id="claim" onclick="startPrank()">🎁 मेरा बोनस चेक करो</button>
  <div id="progress"><div id="bar"></div></div>
  <div id="result"></div>
  <p id="sub" class="small">✨ सिर्फ दोस्तों के साथ मज़ाक — कोई असली पैसा या पेमेंट नहीं।</p>
</div>
<script>
function confetti(){
 const bits=['🪙','💸','✨','🎉','🪔','🎊'];
 for(let i=0;i<34;i++){
  const e=document.createElement('div');e.className='confetti';
  e.textContent=bits[Math.floor(Math.random()*bits.length)];
  e.style.left=Math.random()*100+'vw';
  e.style.animationDuration=(2.2+Math.random()*2.4)+'s';
  e.style.animationDelay=(Math.random()*.7)+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),5200);
 }
}
